<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackveil Studio — cosmic hero preview</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- font-display=optional (not swap): the browser either has the font
         ready almost instantly (cache/fast load) or just keeps the fallback
         for this page view — it never swaps mid-render, which is exactly
         the visible jump being reported. Trade-off: on a very slow first
         load the custom font may not apply until a later visit, but there
         is never a jarring font change while looking at the page. -->
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:ital,opsz,wght@0,12..96,400..800;1,12..96,400..800&family=DM+Sans:wght@300;400;500;600;700&display=optional" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: #03030c;
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            /* overflow-x: hidden (without overflow-y set) forces the UA to compute
               overflow-y as auto per spec, turning html/body into their own scroll
               container — this is exactly what silently breaks position:sticky
               descendants. overflow-x: clip has no such side effect. */
            overflow-x: clip;
        }
        #space-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }
        .page-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
        }
        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 0 40px;
        }
        .hero-title {
            font-family: 'Bricolage Grotesque', 'DM Sans', sans-serif;
            font-size: clamp(48px, 8vw, 128px);
            font-weight: 700;
            line-height: 0.98;
            letter-spacing: -0.03em;
            text-align: center;
            margin: 0;
            color: #ffffff;
            max-width: 1000px;
            user-select: none;
        }
        .hero-title em {
            font-style: italic;
            font-weight: 700;
            background: linear-gradient(90deg, #6b8cf5, #b06ee8, #e8548c);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            padding-bottom: 0.08em;
            display: inline-block;
        }
        #portfolio {
            position: relative;
            width: 100%;
            height: 300vh;
            background: transparent;
        }
        .portfolio-sticky-zone {
            position: sticky;
            top: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        .playground-center-content {
            position: absolute;
            /* Pushed to the top of the sticky viewport — clear of every
               star in the galaxy, sitting on clean dark background, with
               mix-blend-mode below as a second, independent safety net
               rather than the only mechanism. */
            top: 3vh;
            left: 50%;
            /* starts slightly lower, slides up 16px into its resting spot
               once .scrolled lands — same settle motion as before, just a
               fixed pixel offset now that the anchor isn't dead-center */
            transform: translate(-50%, 16px);
            z-index: 10;
            text-align: center;
            max-width: 520px;
            pointer-events: none;
            user-select: none;
            opacity: 0;
            /* Shortened from 0.5s: on a fast scroll fling that lands well past
               the reveal threshold, the animation's real-time duration was
               decoupled from how fast the user actually scrolled — a slow
               fade read as "everything froze" while it caught up. */
            transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1), transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .scrolled .playground-center-content {
            opacity: 1;
            transform: translate(-50%, 0);
        }
        /* mix-blend-mode: difference — the text inverts against whatever's
           directly behind it, so it stays legible even in the rare case a
           bright point ends up under it, without any shadow or blur trick.
           Opacity raised toward 1 on the smaller labels specifically
           because alpha and blend strength are the same knob for this
           technique — a translucent element blends weakly. */
        .playground-eyebrow {
            position: relative;
            font-family: 'DM Sans', sans-serif;
            font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase;
            color: #fff; opacity: 0.8; font-weight: 700; margin-bottom: 12px; display: block;
            mix-blend-mode: difference;
        }
        .playground-title {
            position: relative;
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: clamp(36px, 4.6vw, 76px);
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #f5f5f7;
            margin: 0 0 18px;
            line-height: 1;
            mix-blend-mode: difference;
        }
        .playground-title span {
            font-style: italic;
            background: linear-gradient(90deg, #6b8cf5, #b06ee8, #e8548c);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .playground-subtext {
            position: relative;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            line-height: 1.5;
            color: #fff; opacity: 0.75;
            margin: 0 auto;
            /* Explicit center + its own (narrower than the 520px parent)
               max-width — the short new tagline wraps tightly under the
               title instead of stretching to the parent's full width. No
               text-align: justify was present here before, but centering
               is now stated explicitly rather than inherited. */
            text-align: center;
            max-width: 480px;
            mix-blend-mode: difference;
        }

        .portfolio-columns-container {
            position: absolute;
            top: 0;
            width: 100%;
            height: 100%;
            /* Step 3 of the sequence — cards stay fully invisible and non-
               interactive until the center title has already settled. No card
               is ever visible while the Hero title or the explosion is still
               on screen. */
            opacity: 0;
            transform: translateY(70px);
            pointer-events: none;
            /* Shortened from 0.6s for the same reason as the text reveal —
               keeps a fast scroll fling from reading as a stall while a
               slow, real-time animation catches up. */
            transition: opacity 0.32s cubic-bezier(0.16, 1, 0.3, 1), transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #portfolio.cards-revealed .portfolio-columns-container {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .portfolio-col-left,
        .portfolio-col-right {
            position: absolute;
            top: 0;
            width: 22vw;
            display: flex;
            flex-direction: column;
            will-change: transform;
        }
        .portfolio-col-left { left: 12vw; }
        .portfolio-col-right { right: 12vw; }

        .playground-card {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            display: block;
            border-radius: 20px;
            overflow: hidden;
            background: #0a0a0c;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 20px 40px rgba(20,20,25,.14);
            flex-shrink: 0;
            margin-bottom: 120px;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }
        /* editorial collage tilt — asymmetric per card, not a uniform grid */
        .portfolio-col-left .playground-card { transform: rotate(-3deg); }
        .portfolio-col-right .playground-card { transform: rotate(4deg); }
        .playground-card:hover { transform: scale(1.03) !important; }

        .playground-card-media {
            position: absolute;
            inset: 0;
        }
        /* static photo cards — the default for 9 of 11 projects, near-zero cost */
        .playground-card-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .playground-card:hover .playground-card-media img {
            transform: scale(1.08);
        }
        /* live-site iframe — reserved for the 2 projects whose own hero animates */
        .playground-card-media iframe {
            position: absolute;
            top: 0; left: 0;
            width: 1600px;
            height: 900px;
            border: 0;
            pointer-events: none;
            transform-origin: top left;
            transform: scale(var(--iframe-scale, 0.2));
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .playground-card:hover .playground-card-media iframe {
            transform: scale(calc(var(--iframe-scale, 0.2) * 1.08));
        }

        .card-label {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: #fff;
            z-index: 2;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
        }
        .card-label span {
            font-family: 'Bricolage Grotesque', sans-serif;
            font-style: italic;
        }
        .playground-card:hover .card-label { opacity: 1; transform: translateY(0); }

        @media (max-width: 900px) {
            #portfolio { height: 260vh; }
            .portfolio-col-left, .portfolio-col-right { width: 34vw; }
            .playground-card { margin-bottom: 60px; }
            .playground-title { font-size: 6.5vw; }
        }
        /* below 900px the two card lanes are narrow enough that the center text
           needs its own visual ground to sit on, not just raw z-index — a soft
           glass panel instead of trying to force a zero-overlap layout that
           would leave the cards too tiny to read */
        @media (max-width: 700px) {
            .portfolio-col-left { left: 4vw; width: 32vw; }
            .portfolio-col-right { right: 4vw; width: 32vw; }
            .playground-center-content {
                max-width: 220px;
                padding: 20px 18px;
                border-radius: 20px;
                background: rgba(2, 2, 8, 0.55);
                backdrop-filter: blur(14px);
                -webkit-backdrop-filter: blur(14px);
                border: 1px solid rgba(255, 255, 255, 0.08);
            }
            .playground-title { font-size: 32px; }
            .playground-subtext { font-size: 13px; }
        }
    </style>
</head>
<body>

    <script>
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');
        const portfolioSection = document.getElementById('portfolio');
        const portfolioStickyZone = document.querySelector('.portfolio-sticky-zone');

        // width/height stay in CSS-pixel space — every particle's x/y and all
        // the layout math throughout this file assumes that. The canvas's
        // own backing-store resolution is separately scaled to
        // devicePixelRatio below; without this, on any HiDPI display (very
        // common — most laptops, any Windows scaling above 100%, Retina) the
        // browser stretches a 1x-resolution canvas up to fill the physical
        // pixels, and every small sharp dot blurs into a soft, oversized
        // glow — reads exactly like a halo that isn't actually drawn.
        let width = window.innerWidth;
        let height = window.innerHeight;
        // Capped at 2x: rasterization cost scales with dpr^2 (every fill/
        // gradient/stroke now covers that many more physical pixels), so an
        // uncapped 3x phone/tablet display would pay 2.25x the paint cost of
        // a 2x display for a sharpness difference nobody can actually see.
        // This is exactly the extra cost that was landing hardest at the
        // busiest moment on screen — the explosion's energy peak right
        // before the portfolio reveals, which is the freeze being reported.
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        function resizeCanvasForDPR() {
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resizeCanvasForDPR();

        const mouse = { x: -999, y: -999 };

        function lerp(start, end, amt) {
            return (1 - amt) * start + amt * end;
        }


        function spawnShootingStar() {
            const startX = Math.random() * width * 0.7 + width * 0.15;
            const startY = Math.random() * height * 0.35;
            const angle = Math.PI * 0.15 + Math.random() * Math.PI * 0.12;
            const speed = 9 + Math.random() * 7;
            shootingStars.push({
                x: startX, y: startY,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                len: 90 + Math.random() * 70,
                life: 1,
                decay: 0.012 + Math.random() * 0.008
            });
        }

        // One universe, one array, one pass. Every particle carries drift,
        // cursor-repulsion and explosion-impulse fields at all times — there is
        // no second pool to keep in sync and nothing to skip-vs-not-skip.
        // Visibility is a single alpha envelope (universeAlpha, computed once
        // per frame in render()), not an architectural fork.
        const particles = [];
        const nebulaClouds = [];
        const shootingStars = []; // additive-only feature — own array, own draw pass, touches nothing else
        let shootingCooldown = 200;

        // Hero and Portfolio each get their own cosmic identity — every cloud
        // carries both a Hero hue (warm violet/magenta) and a Portfolio hue
        // (cool blue/indigo/teal), and render() lerps between them as the
        // scroll crosses into the portfolio corridor. One continuous backdrop
        // system, two distinct moods, no extra draw calls either way.
        const heroCloudColors = [
            { r: 138, g: 43,  b: 226 }, // violet
            { r: 255, g: 0,   b: 127 }, // magenta
            { r: 0,   g: 71,  b: 255 }, // blue
            { r: 255, g: 105, b: 180 }  // pink
        ];
        const portfolioCloudColors = [
            { r: 30,  g: 60,  b: 220 }, // sapphire blue
            { r: 70,  g: 20,  b: 180 }, // blue-violet
            { r: 0,   g: 130, b: 150 }, // deep teal
            { r: 40,  g: 90,  b: 200 }  // cyan-indigo
        ];

        for (let i = 0; i < 34; i++) {
            const heroColor = heroCloudColors[Math.floor(Math.random() * heroCloudColors.length)];
            const portfolioColor = portfolioCloudColors[Math.floor(Math.random() * portfolioCloudColors.length)];
            nebulaClouds.push({
                x: Math.random() * width,
                y: Math.random() * height,
                baseX: Math.random() * width,
                baseY: Math.random() * height,
                radius: Math.random() * 220 + 260,
                r: heroColor.r, g: heroColor.g, b: heroColor.b,
                r2: portfolioColor.r, g2: portfolioColor.g, b2: portfolioColor.b,
                baseAlpha: Math.random() * 0.15 + 0.09,
                alpha: 0,
                angle: Math.random() * Math.PI * 2,
                speed: (Math.random() * 0.0015 + 0.0005) / 3
            });
        }

        // 4200 total — bumped up from 3500. Removing the per-star halo made
        // each point much smaller on screen (a 20px glow vs a 1-3px dot), so
        // the same count reads as visibly sparser even though nothing about
        // density changed in the data — this compensates for that directly.
        // ~12% bright foreground "hero" stars, the rest fine background dust.
        for (let i = 0; i < 4200; i++) {
            const isHeroStar = Math.random() > 0.88;
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                vx: (Math.random() - 0.5) * 0.25,
                vy: (Math.random() - 0.5) * 0.25,
                repVx: 0, repVy: 0,   // friction-damped cursor-repulsion velocity
                explVx: 0, explVy: 0, // friction-damped scroll-explosion velocity (hero subset only)
                size: isHeroStar ? Math.random() * 1.6 + 1.1 : Math.random() * 0.6 + 0.2,
                baseAlpha: isHeroStar ? Math.random() * 0.5 + 0.5 : Math.random() * 0.4 + 0.15,
                isHero: isHeroStar,
                twinkleSpeed: Math.random() * 0.003 + 0.001,
                seed: Math.random() * 100,
                colorType: Math.random()
            });
        }

        // The galaxy-core blobs and, later, the nebula clouds/prism rings that
        // used to fill the portfolio backdrop are gone. Picked "Event
        // Horizon" over the other three pitched concepts: it's the only one
        // that's genuinely cheap in Canvas 2D (a handful of edge gradients +
        // small ripple stroke, no per-node/per-particle simulation), it
        // doesn't resurrect the galaxy-core "flat wash" problem (a
        // Supernova-style central glow is the same failure mode at a
        // different position), and it doesn't require WebGL/shader work a
        // liquid-mirror or reflection concept would actually need to look
        // right. Deliberate emptiness is the whole point of this one —
        // matte black, cards lit only by a glowing contour.
        const horizonColors = [
            { r: 107, g: 140, b: 245 }, // blue-violet
            { r: 176, g: 110, b: 232 }, // purple
            { r: 232, g: 84,  b: 140 }, // pink
            { r: 255, g: 255, b: 255 }, // white highlight, for the gradient's brightest stops
            { r: 90,  g: 220, b: 230 }  // cyan, for chromatic fringe + extra ray color
        ];
        const horizonRipples = []; // mouse-echo rings — own array, own draw pass
        let lastRippleX = -999, lastRippleY = -999, rippleCooldown = 0;

        // Dust caught in the corona's light — NOT a general starfield (that
        // was the "flat background" complaint's actual cause two rounds
        // ago). These live in a narrow band hugging the rim itself, angle
        // and radius fixed at init, only their twinkle animates — genuine
        // cosmic detail concentrated exactly where the light is, not spread
        // flatly across the whole frame.
        const rimDust = [];
        for (let i = 0; i < 45; i++) {
            const color = horizonColors[Math.floor(Math.random() * 3)];
            rimDust.push({
                angle: Math.random() * Math.PI * 2,
                radiusJitter: (Math.random() - 0.5) * 90,
                size: Math.random() * 1.3 + 0.4,
                twinkleSpeed: Math.random() * 0.002 + 0.0006,
                seed: Math.random() * 100,
                r: color.r, g: color.g, b: color.b
            });
        }

        // Orbit particles — a dedicated array for the corner oval, built on
        // a SUPERELLIPSE ("squircle") boundary instead of a true ellipse.
        // A true ellipse is tangent to the frame at the edge MIDPOINTS, so
        // the only way to push it toward the corners is to scale it up —
        // which was already measured and proven counterproductive (a
        // uniform scale-up loses visible arc faster than it gains corner
        // reach). A squircle (x/a)^n + (y/b)^n = 1 with n>2 is a genuinely
        // different SHAPE, not just a size: at n=4, fully inscribed
        // (k=1.0, 100% on-screen, no visibility tradeoff at all), its
        // diagonal point sits 84% of the way to the true corner, vs 71%
        // for a true ellipse at the same inscription. That's the real fix
        // for "reaches into the corners" — verified with a coordinate
        // calculation, not eyeballed. Formula per point at angle a:
        // x = sign(cos a) * |cos a|^(2/n), y = sign(sin a) * |sin a|^(2/n),
        // then scaled by the ellipse's own rx/ry. Alpha is fixed per
        // particle at init, never touched per frame — no flicker.
        const orbitParticles = [];
        const ORBIT_COUNT = 900;
        const SQUIRCLE_EXP = 2 / 4; // exponent applied to |cos|/|sin|, i.e. 2/n for n=4
        for (let i = 0; i < ORBIT_COUNT; i++) {
            orbitParticles.push({
                angleOffset: (i / ORBIT_COUNT) * Math.PI * 2 + (Math.random() - 0.5) * 0.02,
                kJitter: 0.97 + Math.random() * 0.06,
                radius: 1 + Math.random() * 0.5,
                alpha: 0.4 + Math.random() * 0.35
            });
        }

        // Galaxy: baked ONCE into an offscreen sprite, same as before — but
        // this time the sprite canvas is sized to MATCH its final on-screen
        // draw size (~2350px) instead of a smaller 900px canvas scaled up.
        // That scale factor was the actual bug behind both "blurry" reports:
        // with imageSmoothingEnabled true, the ~2.6x upscale bilinear-
        // smoothed every sharp circle back into softness; with it false,
        // a ~1px sprite-space dot became a blocky ~2.6px mosaic square
        // instead of a clean small circle (that's what the last screenshot
        // actually showed — pixelation, not blur). At true ~1:1 scale
        // neither failure mode exists: "radius 1px" in the code really is
        // 1 on-screen pixel, with no interpolation step involved at all.
        // A live per-frame version (thousands of individual arc+fill calls
        // every frame, no baking) was tried first and measured at ~10.7ms/
        // frame — a real, significant fraction of a 16.6ms budget for one
        // subsystem alone, and exactly the class of regression this
        // project spent multiple earlier rounds eliminating. Baking keeps
        // the per-frame cost back down to a single drawImage call.
        const galaxyNeon = [
            { r: 58,  g: 52,  b: 214 }, // deep ultramarine
            { r: 168, g: 58,  b: 232 }, // violet
            { r: 230, g: 32,  b: 168 }  // magenta
        ];

        const galaxySprite = document.createElement('canvas');
        const GALAXY_SPRITE_SIZE = 2350; // matches galaxyDraw below exactly — 1:1 blit, no scale step
        galaxySprite.width = GALAXY_SPRITE_SIZE;
        galaxySprite.height = GALAXY_SPRITE_SIZE;

        // Real logarithmic spiral (r = a * e^(b*theta)) — an Archimedean
        // spiral (constant radius step per angle step) has almost-constant
        // curvature and, at any real density, individual arms read as
        // straight radial spokes rather than curves. A log spiral's
        // curvature tightens near the core and relaxes outward — the
        // actual shape of a real spiral galaxy.
        const SPIRAL_A = 15 * (GALAXY_SPRITE_SIZE / 900);
        const SPIRAL_THETA_MAX = Math.PI * 2.35;
        const SPIRAL_MAX_R = GALAXY_SPRITE_SIZE * 0.46;
        const SPIRAL_B = Math.log(SPIRAL_MAX_R / SPIRAL_A) / SPIRAL_THETA_MAX;
        function spiralPoint(tNorm, armOffset) {
            const theta = SPIRAL_THETA_MAX * Math.pow(tNorm, 0.72);
            const r = SPIRAL_A * Math.exp(SPIRAL_B * theta);
            return { theta: theta + armOffset, r };
        }

        (function paintGalaxySprite() {
            const sctx = galaxySprite.getContext('2d');
            const scx = GALAXY_SPRITE_SIZE / 2, scy = GALAXY_SPRITE_SIZE / 2;

            // Crystal-clear, no exceptions: no createRadialGradient
            // anywhere in this function, shadowBlur forced to 0 up front.
            // Every star is one plain ctx.arc() + solid rgba fill — the
            // only softness is semi-transparent circles overlapping under
            // 'lighter', not blurred edges. Radius is 1-1.5px in FINAL
            // on-screen pixels (sprite is already 1:1 scale with its draw
            // size, so no conversion factor needed here at all).
            sctx.globalCompositeOperation = 'lighter';
            sctx.shadowBlur = 0;
            function crispStar(x, y, colorIdx) {
                const color = galaxyNeon[colorIdx % 3];
                const alpha = 0.4 + Math.random() * 0.35;
                const radius = 1 + Math.random() * 0.5;
                sctx.beginPath();
                sctx.arc(scx + x, scy + y, radius, 0, Math.PI * 2);
                sctx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha})`;
                sctx.fill();
            }

            // Core cluster — count roughly 2.5x the last round's 532.
            const CORE_COUNT = 1330;
            for (let i = 0; i < CORE_COUNT; i++) {
                const ang = Math.random() * Math.PI * 2;
                const rad = Math.pow(Math.random(), 1.3) * GALAXY_SPRITE_SIZE * 0.12;
                crispStar(Math.cos(ang) * rad, Math.sin(ang) * rad * 0.55, i);
            }

            // 3 arms along the log-spiral centerline — count roughly 2.5x
            // the last round's 672/arm. Each star still scattered off the
            // ideal curve (perpendicular + along it, proportional to a
            // pseudo-depth value) so the arm reads as a voluminous band,
            // not a wire.
            const arms = 3, POINTS_PER_ARM = 1680;
            for (let arm = 0; arm < arms; arm++) {
                const armOffset = (arm / arms) * Math.PI * 2;
                // Scatter magnitudes scaled by the same sprite-size ratio
                // as everything else here, to preserve the same relative
                // arm thickness the earlier 900-unit version had — without
                // this, the arms would read thinner/tighter now that the
                // galaxy's overall footprint grew to match its final size.
                const scatterScale = GALAXY_SPRITE_SIZE / 900;
                for (let t = 0; t < POINTS_PER_ARM; t++) {
                    const tNorm = t / POINTS_PER_ARM;
                    const { theta, r } = spiralPoint(tNorm, armOffset);
                    const pz = Math.random();
                    const puff = (6 + tNorm * 22) * scatterScale;
                    const perp = (Math.random() - 0.5) * 2 * puff * (0.4 + pz * 0.6);
                    const along = (Math.random() - 0.5) * 2 * (4 + tNorm * 10) * scatterScale;
                    const rr = r + along;
                    const perpAngle = theta + Math.PI / 2;
                    const x = Math.cos(theta) * rr + Math.cos(perpAngle) * perp;
                    const y = (Math.sin(theta) * rr + Math.sin(perpAngle) * perp) * 0.55;
                    crispStar(x, y, arm);
                }
            }
        })();

        // The live twinkling sparkle layer (18 points, alpha modulated via
        // Math.sin every frame, plus a per-frame createRadialGradient each)
        // was removed outright — it was both a real per-frame cost and, by
        // definition, a flicker source. "No dimming/pulsing, no gradients
        // outside init" rules out the whole mechanism, not just parts of
        // it; the main star field is already dense enough to not need a
        // separate accent layer on top.
        //
        // Side streamers: sparse dust flanking the LEFT/RIGHT edges of the
        // screen, filling the empty gap outside the card oval. Positions
        // are fixed at init (angle/radius parameters only — actual x/y is
        // computed from the current width/height each frame, same pattern
        // as rimDust below), and every point draws as one flat, static-
        // alpha fill — no gradient, no shadowBlur, no twinkle, so this
        // whole layer costs 36 plain ctx.arc()+fill() calls per frame.
        const sideStreamers = [];
        for (let side = -1; side <= 1; side += 2) {
            for (let i = 0; i < 18; i++) {
                const t = i / 17;
                sideStreamers.push({
                    side, t,
                    rJitter: (Math.random() - 0.5) * 0.14,
                    size: 1.3 + Math.random() * 2.1,
                    color: galaxyNeon[i % 3]
                });
            }
        }

        // raw cursor position, no smoothing/lerp on the mouse itself — the
        // "smoothness" now comes entirely from the particles' own friction
        document.addEventListener('mousemove', function(e){ mouse.x = e.clientX; mouse.y = e.clientY; });

        // --- Portfolio: sticky centered text, two columns of real projects
        // floating past at different scroll-linked speeds ---
        const colLeft = document.getElementById('col-left');
        const colRight = document.getElementById('col-right');
        let currentLeftY = 0, currentRightY = 0;

        (function initPortfolioCards() {
            const cards = Array.from(document.querySelectorAll('.playground-card'));
            // Both live-site iframes (U Stefanów, La Vie Club) are two full,
            // independent websites — their own JS/fonts/images loading
            // immediately at page load was real, measurable work competing
            // with this page's own first paint, which is exactly what the
            // reported 2-3s freeze on refresh was. IntersectionObserver with
            // a generous 1000px margin instead: starts loading well before
            // the card is anywhere near the viewport (a full scroll's worth
            // of lead time), so it's ready by the time it's actually visible
            // without ever costing anything at the moment the page opens.
            const iframeCards = cards.filter((card) => card.querySelector('iframe'));

            function sizeIframes() {
                iframeCards.forEach((card) => {
                    const s = card.offsetWidth / 1600;
                    card.style.setProperty('--iframe-scale', s.toFixed(4));
                });
            }
            sizeIframes();
            window.addEventListener('resize', sizeIframes);

            // Both embedded sites show their own cookie banner on load. They're
            // same-origin with this page (both under blackveil-studio.github.io),
            // so it can be dismissed straight through contentDocument — no
            // cross-origin restriction here.
            const cookieBannerFixes = {
                'iframe-ustefanow': (doc) => {
                    const el = doc.getElementById('cookie-bar');
                    if (el) el.style.display = 'none';
                },
                'iframe-lavieclub': (doc) => {
                    const el = doc.getElementById('cookieNotice');
                    if (el) el.style.display = 'none';
                }
            };

            const iframeObserver = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    const iframe = entry.target;
                    if (entry.isIntersecting && !iframe.src) {
                        iframe.src = iframe.dataset.src;
                        iframe.addEventListener('load', () => {
                            const fix = cookieBannerFixes[iframe.id];
                            if (fix) { try { fix(iframe.contentDocument); } catch (e) { /* cross-origin fallback: leave banner as-is */ } }
                        });
                        iframeObserver.unobserve(iframe);
                    }
                });
            }, { rootMargin: '1000px' });

            iframeCards.forEach((card) => {
                iframeObserver.observe(card.querySelector('iframe'));
            });
        })();

        // Reading offsetTop/offsetHeight forces a synchronous layout flush.
        // Doing that on every 'scroll' event AND every render() frame (both
        // firing dozens of times a second during a fling) is exactly what was
        // causing the hitch — cache the geometry once and only refresh it on
        // resize, so the hot scroll/render path never touches layout at all.
        let portfolioTopCached = 0;
        let portfolioHeightCached = 0;
        // Each column's own content height, so its scroll-through distance is
        // driven by what's actually in it rather than a fixed guess — with
        // asymmetric constants (-1300 vs -650) tuned for the old 6-card
        // columns, equal 4-card columns now, the left column ran fully off
        // the top with cards still left to show on the right (empty gap,
        // screenshot-confirmed). Both columns now travel the same fraction
        // of their own height, so neither depletes before the other.
        let colLeftHeightCached = 0;
        let colRightHeightCached = 0;
        // The scroll-progress value (same 0-1 `progress` used to drive the
        // card columns below) at which the portfolio block should start
        // flying off screen. Tied to one specific card — the last card in
        // the right column ("Innovative Ink") — target: its bottom edge
        // sits 175px above the bottom of the viewport (middle of the
        // requested 150-200px window).
        //
        // First attempt computed this from offsetTop/offsetHeight plus the
        // column's translateY formula by hand — wrong by ~80px in testing.
        // The gap was .portfolio-col-right .playground-card's own
        // `rotate(4deg)` tilt: getBoundingClientRect() reports the rotated
        // element's actual painted bounding box, which is measurably
        // taller/offset from its unrotated layout box (measured: 178px
        // rendered vs 158px offsetHeight), and re-deriving that rotation
        // math by hand a second time isn't worth the risk of getting it
        // wrong again. Measuring the real rect at two known transform
        // states and fitting a line is exact regardless of rotation,
        // origin, or anything else applied to the card — the relationship
        // is linear in progress either way, since the column's own
        // translateY is linear and rotation only ever contributes a fixed
        // offset to that line, not a curve.
        let releaseProgress = 0.5;
        function cacheSectionGeometry() {
            portfolioTopCached = portfolioSection.offsetTop;
            portfolioHeightCached = portfolioSection.offsetHeight;
            colLeftHeightCached = colLeft.scrollHeight;
            colRightHeightCached = colRight.scrollHeight;

            // Measures ONE fixed quantity: how far below colRight's own top
            // edge the (rotated) last card's bottom edge sits. This is a
            // pure local/layout property of the card — its offsetTop,
            // offsetHeight, and the fixed rotate(4deg) tilt each right-
            // column card has — and provably independent of colRight's own
            // translateY, since translating a parent shifts every
            // descendant's rect by the exact same delta, which cancels out
            // of a (child - parent) subtraction. That independence is what
            // makes this safe to measure at ANY moment (page load, mid-
            // scroll, whatever), instead of needing the sticky zone to
            // already be pinned.
            //
            // Two real bugs found getting here, both from measuring
            // getBoundingClientRect() while something was mid-transition:
            // .portfolio-columns-container has its own `transition:
            // transform 0.32s` for its reveal — forcing its transform via
            // inline style still respects that transition (any change to a
            // transitioned property animates, class-driven or not), so an
            // immediate read after setting it was catching a mid-animation
            // value, not the settled one. Disabling the transition for the
            // instant of measurement (then restoring it) fixes that, and
            // is the only way this needed to touch that element at all —
            // simply not touching it, unlike a first attempt at this, left
            // whatever un-settled transform happened to be active bleeding
            // into the measurement.
            const lastRightCard = colRight.lastElementChild;
            const columnsContainer = colRight.parentElement;
            const savedContainerTransition = columnsContainer.style.transition;
            const savedContainerTransform = columnsContainer.style.transform;
            const savedColTransform = colRight.style.transform;
            columnsContainer.style.transition = 'none';
            columnsContainer.style.transform = 'translateY(0px)';
            colRight.style.transform = 'translate3d(0px, 0px, 0)';
            void columnsContainer.offsetHeight; // force layout so the transition-free style is actually applied before the read below
            const colRightTopNow = colRight.getBoundingClientRect().top;
            const cardBottomNow = lastRightCard.getBoundingClientRect().bottom;
            const rotatedBottomOffset = cardBottomNow - colRightTopNow;
            colRight.style.transform = savedColTransform;
            columnsContainer.style.transform = savedContainerTransform;
            columnsContainer.style.transition = savedContainerTransition;

            // colRight's own static top (when the zone is actually pinned)
            // is 0 — .portfolio-columns-container sits at top:0 within the
            // sticky zone, colRight sits at top:0 within that — so its
            // in-viewport top at a given progress is just its own
            // translateY, the same -progress*colRightHeightCached*0.95 the
            // render loop already applies. Solve for the card's bottom
            // edge sitting 175px above the bottom of the viewport (middle
            // of the requested 150-200px window).
            const TARGET_DIST_FROM_BOTTOM = 175;
            const targetBottom = height - TARGET_DIST_FROM_BOTTOM;
            const p = (rotatedBottomOffset - targetBottom) / (colRightHeightCached * 0.95);
            releaseProgress = Math.max(0, Math.min(0.95, p));
        }
        cacheSectionGeometry();

        // The whole hero -> portfolio handoff — burst, title exit, text-in,
        // cards-in — lives in one compact, fixed 0-500px window driven by a
        // single scrollPercent value (computed in render()). No spacer, no
        // viewport-relative floor.
        const TEXT_REVEAL_AT = 500;  // portfolio starts revealing exactly as the burst finishes
        const CARDS_REVEAL_AT = 560; // close behind the text — cards are already
                                      // sliding in while the title is still
                                      // animating into its lock, not waiting
                                      // for it to finish settling.

        // Explosion energy — a real accumulator with its own momentum, NOT a
        // function of static scrollY. This is what fixes the "streaks freeze
        // into rigid sticks the instant you stop scrolling" bug: the streak
        // length now comes from each star's own decaying velocity, which keeps
        // evolving every render() frame regardless of whether scroll events are
        // still arriving. Only fuelled near the hero/transition zone, and ONLY
        // on forward (downward) scroll — injecting energy on the way back up
        // was driving explosionEnergy negative, which flips the radial push
        // into an inward pull and clumps the stars into the ugly center knot
        // seen on scroll-up. Scrolling up now just lets existing energy run out
        // via its own friction below, never adds a reverse impulse.
        let explosionEnergy = 0;
        let lastScrollYForEnergy = 0;
        window.addEventListener('scroll', () => {
            const newScrollY = window.scrollY;
            const deltaScroll = newScrollY - lastScrollYForEnergy;
            lastScrollYForEnergy = newScrollY;
            if (deltaScroll > 0 && newScrollY < 500) {
                explosionEnergy += deltaScroll * 0.06;
                explosionEnergy = Math.min(6, explosionEnergy);
            }

            if (newScrollY >= TEXT_REVEAL_AT) {
                portfolioSection.classList.add('scrolled');
            } else {
                portfolioSection.classList.remove('scrolled');
            }
            if (newScrollY >= CARDS_REVEAL_AT) {
                portfolioSection.classList.add('cards-revealed');
            } else {
                portfolioSection.classList.remove('cards-revealed');
            }
        });

        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            resizeCanvasForDPR();
            cacheSectionGeometry();
        });

        // Edge-triggered — the position reshuffle below must fire exactly once
        // per arrival at the top, not every frame you happen to be sitting there.
        let wasAtTop = true;

        function render(time) {

            const scrollY = window.scrollY;

            // Energy decays every single frame, independent of whether a scroll
            // event ever arrives again — this is what lets the streaks keep
            // shrinking and the stars keep coasting outward after you stop.
            // Hard reset at the top: energy to 0, AND every particle's position
            // reshuffled fresh via Math.random(). Explosion residue can leave
            // stars parked out near the edges after a burst — without a real
            // position reset, scrolling back up would settle into that leftover
            // scatter instead of the pristine opening field. Fires once on
            // arrival (wasAtTop edge trigger), not every frame at rest, so nothing
            // visibly teleports while you're actually looking at the calm top.
            if (scrollY < 5) {
                explosionEnergy = 0;
                if (!wasAtTop) {
                    particles.forEach(p => {
                        p.x = Math.random() * width;
                        p.y = Math.random() * height;
                        p.explVx = 0; p.explVy = 0;
                        p.repVx = 0; p.repVy = 0;
                    });
                    wasAtTop = true;
                }
            } else {
                explosionEnergy *= 0.93;
                wasAtTop = false;
            }

            // --- Zone math, all pure functions of window.scrollY, all continuous.
            // One scrollPercent drives the entire 0-500px hero->portfolio burst —
            // no separate wake/sleep/peak windows to keep in sync by hand. ---
            const scrollPercent = Math.min(scrollY / 500, 1);

            // Nebula swell: a single sine hump over scrollPercent — 0 at the top,
            // peaks exactly halfway through the burst, back to 0 as it completes.
            const hyperspaceEase = Math.sin(scrollPercent * Math.PI);

            // How far each cloud has crossfaded from its Hero hue to its
            // Portfolio hue — completes exactly as the burst does (by 500px),
            // giving the portfolio its own cool blue/indigo/teal identity
            // instead of just reusing the Hero's warm violet/magenta.
            const nebulaColorMix = Math.max(0, Math.min(1, (scrollPercent - 0.4) / 0.6));

            // The burst's own dense field: fully present through the burst,
            // dissolves over 500-750px, giving the "coast to the edges and
            // fade" its own room even if you stop scrolling right at 500.
            const universeAlpha = Math.max(0, Math.min(1, 1 - (scrollY - 500) / 250));

            // Without this, the portfolio backdrop was nebula clouds alone —
            // which reads as a flat colored gradient, not space. A dim, calm
            // starfield stays present the whole way through the corridor
            // (same drift + cursor-repulsion, no explosion — that's already
            // spent) so there's real depth and sparkle behind the cards, not
            // just a smooth color wash. Cheap: no explosion streaks, no halo,
            // just flat dots.
            //
            // Event Horizon concept: the portfolio background is now
            // deliberate emptiness — matte black, no clouds, no dust — so
            // stars stay a Hero-only thing. universeAlpha itself already
            // reaches 0 by scrollY 750, well before the portfolio corridor.
            const starVisibility = universeAlpha;

            // Event Horizon: the glowing contour around the portfolio
            // viewport. Fades in over the burst's second half, full presence
            // for the rest of the corridor — its exit is handled entirely
            // by the fly-off release (positional, moving off-screen), not
            // an alpha fade tied to a next section that no longer exists.
            const horizonAlpha = Math.max(0, Math.min(1, (scrollPercent - 0.5) / 0.5));

            // --- background: forced dark theme, always ---
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#03030c';
            ctx.fillRect(0, 0, width, height);

            // --- Zone 2 corridor: orbital arc motion, strictly scroll-driven ---
            let progress = (scrollY - portfolioTopCached) / (portfolioHeightCached - window.innerHeight);
            progress = Math.max(0, Math.min(1, progress));
            // Each column travels a little past its own content height (1.1x)
            // so the last card clears the viewport by the end of the scroll —
            // same relative overshoot for both, so they run out together
            // instead of one draining early. A small 1.15/0.95 split keeps a
            // touch of the original asymmetric parallax feel without letting
            // either column empty out first.
            const targetLeftY = -progress * colLeftHeightCached * 1.15;
            const targetRightY = -progress * colRightHeightCached * 0.95;
            currentLeftY = lerp(currentLeftY, targetLeftY, 0.35);
            currentRightY = lerp(currentRightY, targetRightY, 0.35);
            // cards bow outward mid-scroll and return near-center at both ends —
            // a single arc bulge simulating an orbit path around the fixed text
            const arcAmplitude = width < 700 ? 20 : 70;
            const arcSwing = Math.sin(progress * Math.PI) * arcAmplitude;
            colLeft.style.transform = `translate3d(${-arcSwing}px, ${currentLeftY}px, 0)`;
            colRight.style.transform = `translate3d(${arcSwing}px, ${currentRightY}px, 0)`;

            // --- Early release: once the lowest card's bottom edge has
            // crossed 50vh (releaseProgress, computed from real geometry
            // above), the whole pinned zone starts riding up and off with
            // the remaining scroll instead of staying stuck through the
            // rest of it. releaseAmount is a pure function of `progress`
            // (itself a pure function of scrollY) — no independent timer,
            // no easing lag, so it can never drift out of sync with the
            // actual scroll position it's driving off of. Applied to
            // .portfolio-sticky-zone directly: sticky positioning is a
            // layout-time calculation, transforms happen at paint time, so
            // the two don't fight — the zone stays "stuck" for layout
            // purposes while visually riding up on top of that.
            const releaseAmount = Math.max(0, Math.min(1, (progress - releaseProgress) / (1 - releaseProgress)));
            const flyOffsetPx = releaseAmount * height;
            portfolioStickyZone.style.transform = flyOffsetPx > 0 ? `translateY(${-flyOffsetPx}px)` : '';

            // --- nebula clouds — Hero-only now. Swells through the first half
            // of the burst, then fades out over the second half so it's
            // fully gone by scrollY 500 — handing off to matte black + the
            // Event Horizon glow exactly as the portfolio corridor begins,
            // rather than lingering through it. ---
            ctx.globalCompositeOperation = 'screen';
            const cloudScale = 1 + hyperspaceEase * 0.5;
            ctx.save();
            ctx.translate(width / 2, height / 2);
            ctx.scale(cloudScale, cloudScale);
            ctx.translate(-width / 2, -height / 2);
            const cloudVisibility = Math.max(0, 1 - Math.max(0, (scrollPercent - 0.5) / 0.5));
            if (cloudVisibility > 0.001) {
                nebulaClouds.forEach(cloud => {
                    cloud.angle += cloud.speed;
                    cloud.x = cloud.baseX + Math.cos(cloud.angle) * 35;
                    cloud.y = cloud.baseY + Math.sin(cloud.angle) * 35;
                    cloud.alpha = cloud.baseAlpha * cloudVisibility;

                    if (cloud.alpha > 0.001) {
                        const cr = Math.round(lerp(cloud.r, cloud.r2, nebulaColorMix));
                        const cg = Math.round(lerp(cloud.g, cloud.g2, nebulaColorMix));
                        const cb = Math.round(lerp(cloud.b, cloud.b2, nebulaColorMix));
                        const gradient = ctx.createRadialGradient(cloud.x, cloud.y, 5, cloud.x, cloud.y, cloud.radius);
                        gradient.addColorStop(0, `rgba(${cr}, ${cg}, ${cb}, ${cloud.alpha})`);
                        gradient.addColorStop(0.5, `rgba(${cr}, ${cg}, ${cb}, ${cloud.alpha * 0.35})`);
                        gradient.addColorStop(1, `rgba(${cr}, ${cg}, ${cb}, 0)`);

                        ctx.beginPath();
                        ctx.arc(cloud.x, cloud.y, cloud.radius, 0, Math.PI * 2);
                        ctx.fillStyle = gradient;
                        ctx.fill();
                    }
                });
            }
            ctx.restore();

            // --- Event Horizon v3: full cosmic treatment. Same core technique
            // as v2 (multi-pass shadowBlur stroke is what actually reads as
            // neon glow — verified, a single pass doesn't) but with real
            // eclipse-corona detail layered on: streamers radiating from the
            // rim, a dimmer echo ring behind it for depth, chromatic fringing
            // for a premium optical feel, and dust caught in the light along
            // the rim itself (not spread across the frame — that was the
            // original "flat background" problem). Still one ellipse shape,
            // everything else is either procedural (rays, needs no stored
            // state) or a small fixed array (70 dust points). ---
            if (horizonAlpha > 0.001) {
                ctx.globalCompositeOperation = 'screen';
                const pulse = 0.8 + 0.2 * Math.sin(time * 0.0009);
                const breathe = 1 + 0.012 * Math.sin(time * 0.0004);
                // The original ellipse was already exactly inscribed —
                // tangent to all 4 viewport edges at k=0.5. This is a
                // UNIFORM scale, so "bigger" doesn't mean "reaches the
                // corners more" — it means the whole curve moves away from
                // center in every direction at once, which shrinks how
                // much of the circumference survives inside the frame.
                // Checked properly this round (360-point angular sweep
                // against a real 1280x800 frame, not eyeballed): k=0.54
                // keeps 50% of the curve on-screen; k=0.58 (what the last
                // round pushed it to, trying to look "bigger") keeps only
                // 32% — the increase was actively making LESS of the oval
                // visible, concentrated away from the corners, not toward
                // them. Reverted to 0.54, the actual best-visibility value
                // this shape supports; real "bigger and bolder" now comes
                // from the stardust ring's own size/brightness below, not
                // from stretching the ellipse further.
                const rimRx = width * 0.54 * breathe;
                const rimRy = height * 0.54 * breathe;
                // cy carries the same flyOffsetPx the DOM sticky-zone is
                // being translated by, so the corona/galaxy/ring ride up in
                // lockstep with the text and cards rather than staying put
                // while everything else leaves — canvas content has no
                // transform of its own to piggyback on, so the offset has
                // to be baked into the center coordinate directly.
                const cx = width / 2, cy = height / 2 - flyOffsetPx;
                const a = horizonAlpha * pulse;

                // rot still drives the streamers/sparks below, just no
                // longer a gradient rotation for a stroke that no longer
                // exists.
                const rot = (time * 0.00003) % (Math.PI * 2);

                // Orbit particles — the corner oval, built on a squircle
                // boundary (see the array's own init comment for the
                // corner-distance math) instead of a true ellipse, so it
                // genuinely reaches closer to the corners without losing
                // visible arc the way scaling up a true ellipse does.
                // Shared angle = time * orbitSpeed (pure function of time,
                // nothing accumulates). One plain fill per point, alpha
                // fixed per particle at init — no gradient, no shadowBlur,
                // no per-frame randomness anywhere in this loop.
                const orbitAngle = time * 0.00002;
                ctx.save();
                ctx.shadowBlur = 0;
                orbitParticles.forEach(p => {
                    const ang = p.angleOffset + orbitAngle;
                    const c = Math.cos(ang), s = Math.sin(ang);
                    const ex = Math.sign(c) * Math.pow(Math.abs(c), SQUIRCLE_EXP);
                    const ey = Math.sign(s) * Math.pow(Math.abs(s), SQUIRCLE_EXP);
                    const px = cx + ex * width * 0.5 * p.kJitter;
                    const py = cy + ey * height * 0.5 * p.kJitter;
                    ctx.beginPath();
                    ctx.arc(px, py, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(60, 120, 255, ${p.alpha * a})`;
                    ctx.fill();
                });
                ctx.restore();

                // Streamers — thin rays radiating out from points around the
                // rim, varying length/brightness per ray (fixed per index, so
                // the rhythm reads as organic rather than uniform), all
                // collected into ONE path/stroke, no blur.
                ctx.strokeStyle = `rgba(${horizonColors[3].r}, ${horizonColors[3].g}, ${horizonColors[3].b}, ${a * 0.3})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                const RAY_COUNT = 16;
                for (let ri = 0; ri < RAY_COUNT; ri++) {
                    const rAngle = (ri / RAY_COUNT) * Math.PI * 2 + rot * 0.5;
                    const lenPulse = 0.6 + 0.4 * Math.sin(ri * 2.7 + time * 0.0008);
                    const rayLen = (20 + (ri % 5) * 12) * lenPulse;
                    const bx = cx + Math.cos(rAngle) * rimRx, by = cy + Math.sin(rAngle) * rimRy;
                    const ex = cx + Math.cos(rAngle) * (rimRx + rayLen), ey = cy + Math.sin(rAngle) * (rimRy + rayLen);
                    ctx.moveTo(bx, by);
                    ctx.lineTo(ex, ey);
                }
                ctx.stroke();

                // Galaxy — one drawImage blit of the sprite baked above, at
                // ~1:1 scale (galaxyDraw matches GALAXY_SPRITE_SIZE exactly)
                // so there's no upscale step to blur OR pixelate. A live
                // per-star version (no sprite, redrawing all ~6370 arcs
                // every frame) was tried first and measured at ~10.7ms/
                // frame — too much for one subsystem in a 16.6ms budget.
                // Baking keeps this back to a single cheap blit.
                const galaxyDraw = GALAXY_SPRITE_SIZE;
                const galaxyRotSpeed = 0.000028;
                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                ctx.imageSmoothingEnabled = false;
                ctx.shadowBlur = 0;
                ctx.globalAlpha = horizonAlpha;
                ctx.translate(cx, cy);
                ctx.rotate(time * galaxyRotSpeed); // autonomous, own clock only — no mouse term anywhere in this block
                ctx.drawImage(galaxySprite, -galaxyDraw / 2, -galaxyDraw / 2, galaxyDraw, galaxyDraw);
                ctx.restore();

                // Side streamers — sparse dust flanking the screen's left/
                // right edges, outside the card oval, filling what was
                // empty space. Flat, static-alpha fills only: no gradient,
                // no shadowBlur, no twinkle, computed from the same
                // rimRx/rimRy ellipse the corona itself uses so it reads as
                // part of the same structure, not a bolted-on extra.
                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                ctx.globalAlpha = horizonAlpha * 0.55;
                sideStreamers.forEach(sp => {
                    // Symmetric sweep centered on due-left (PI) or due-right
                    // (0) — spans both above and below the horizontal, not
                    // just one side of it.
                    const center = sp.side < 0 ? Math.PI : 0;
                    const angle = center + (sp.t - 0.5) * Math.PI * 0.56;
                    const rScale = 1.05 + Math.sin(sp.t * Math.PI) * 0.62 + sp.rJitter;
                    const px = cx + Math.cos(angle) * rimRx * rScale;
                    const py = cy + Math.sin(angle) * rimRy * rScale;
                    ctx.beginPath();
                    ctx.arc(px, py, sp.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${sp.color.r}, ${sp.color.g}, ${sp.color.b}, 0.7)`;
                    ctx.fill();
                });
                ctx.restore();

                // No text-contrast trick needed here at all anymore — the
                // text sits at the very top of the sticky viewport (see
                // CSS), so it no longer shares screen space with the
                // galaxy. mix-blend-mode on the text itself is the backup.

                // Dust caught in the corona's light — twinkling points fixed
                // to the rim (angle + radius jitter set once at init), so
                // they read as texture belonging to the light itself, not a
                // generic starfield scattered across the frame.
                ctx.save();
                rimDust.forEach(d => {
                    const dx = cx + Math.cos(d.angle) * (rimRx + d.radiusJitter);
                    const dy = cy + Math.sin(d.angle) * (rimRy + d.radiusJitter);
                    const twinkle = 0.3 + Math.sin(time * d.twinkleSpeed + d.seed) * 0.35 + 0.35;
                    const da = a * twinkle * 0.8;
                    ctx.beginPath();
                    ctx.arc(dx, dy, d.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${d.r}, ${d.g}, ${d.b}, ${da})`;
                    ctx.fill();
                });
                ctx.restore();

                // Sparks traveling along the rim, evenly spaced, each its
                // own small glowing point — separate from the dust, these
                // move continuously rather than just twinkling in place.
                ctx.save();
                ctx.shadowBlur = 20 * horizonAlpha;
                for (let s = 0; s < 4; s++) {
                    const sAngle = rot * 3 + (s / 4) * Math.PI * 2 + time * 0.0006;
                    const sx = cx + Math.cos(sAngle) * rimRx;
                    const sy = cy + Math.sin(sAngle) * rimRy;
                    const sc = horizonColors[s % horizonColors.length];
                    ctx.shadowColor = `rgba(${sc.r}, ${sc.g}, ${sc.b}, ${a})`;
                    ctx.beginPath();
                    ctx.arc(sx, sy, 2.2, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${a})`;
                    ctx.fill();
                }
                ctx.restore();

                // Mouse echo — a soft glowing ring spawns where the cursor
                // moves, expands and fades, cycling through the same 3
                // brand colors. Throttled by both a cooldown and a minimum-
                // movement threshold so resting the mouse spawns nothing.
                if (horizonAlpha > 0.5 && mouse.x > -900) {
                    rippleCooldown--;
                    const moved = Math.hypot(mouse.x - lastRippleX, mouse.y - lastRippleY);
                    if (moved > 40 && rippleCooldown <= 0) {
                        const c = horizonColors[horizonRipples.length % horizonColors.length];
                        horizonRipples.push({ x: mouse.x, y: mouse.y, radius: 4, alpha: 0.5, r: c.r, g: c.g, b: c.b });
                        lastRippleX = mouse.x; lastRippleY = mouse.y;
                        rippleCooldown = 8;
                    }
                }
                ctx.save();
                ctx.shadowBlur = 12;
                for (let i = horizonRipples.length - 1; i >= 0; i--) {
                    const r = horizonRipples[i];
                    r.radius += 3.4;
                    r.alpha *= 0.93;
                    if (r.alpha < 0.01) { horizonRipples.splice(i, 1); continue; }
                    const ra = r.alpha * horizonAlpha;
                    ctx.shadowColor = `rgba(${r.r}, ${r.g}, ${r.b}, ${ra})`;
                    ctx.beginPath();
                    ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(${r.r}, ${r.g}, ${r.b}, ${ra})`;
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                }
                ctx.restore();
            }

            ctx.globalCompositeOperation = 'screen';

            // --- The one and only particle pass: drift, friction-based cursor
            // repulsion, and scroll-explosion impulse, all in a single forEach.
            // Hero-only now — starVisibility (= universeAlpha) reaches 0 by
            // scrollY 750, so this ~4200-particle loop is skipped entirely
            // for the whole portfolio corridor, not just drawn at alpha 0. ---
            if (starVisibility > 0.001) {
                particles.forEach(p => {
                    // constant ambient wander — never damped, always present,
                    // exactly what keeps the field "alive" at rest
                    p.x += p.vx; p.y += p.vy;

                    // cursor repulsion — inertial, not a magnet: the cursor adds
                    // to a dedicated velocity channel, friction (0.96) coasts it
                    // back to rest, so stars glide away and settle instead of
                    // snapping to a fixed offset from the pointer. Radius 90px,
                    // impulse 0.35 — stars part gently right under the cursor,
                    // not in a wide fast blast across the screen.
                    const dx = p.x - mouse.x;
                    const dy = p.y - mouse.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 90 && dist > 0) {
                        const f = (90 - dist) / 90;
                        p.repVx += (dx / dist) * f * 0.35;
                        p.repVy += (dy / dist) * f * 0.35;
                    }
                    p.repVx *= 0.96;
                    p.repVy *= 0.96;
                    p.x += p.repVx;
                    p.y += p.repVy;

                    // scroll-explosion impulse — hero subset only (~12%). Its own
                    // velocity channel so its friction never touches the ambient
                    // drift or the cursor-repulsion channel above. The radial
                    // injection (the sqrt + two multiply-adds) only runs while
                    // there's real energy to inject — outside the burst window
                    // explosionEnergy is 0 and this was pure wasted work on
                    // every isHero particle, every frame.
                    let explSpeed = 0;
                    if (p.isHero) {
                        if (explosionEnergy > 0.001) {
                            const rdx = p.x - width / 2;
                            const rdy = p.y - height / 2;
                            const rdist = Math.sqrt(rdx * rdx + rdy * rdy) || 1;
                            p.explVx += (rdx / rdist) * explosionEnergy;
                            p.explVy += (rdy / rdist) * explosionEnergy;
                        }
                        p.explVx *= 0.93;
                        p.explVy *= 0.93;
                        explSpeed = Math.hypot(p.explVx, p.explVy);
                        if (explSpeed > 18) {
                            p.explVx = (p.explVx / explSpeed) * 18;
                            p.explVy = (p.explVy / explSpeed) * 18;
                            explSpeed = 18;
                        }
                        p.x += p.explVx;
                        p.y += p.explVy;
                    }

                    if (p.x < -20) p.x = width + 20;
                    if (p.x > width + 20) p.x = -20;
                    if (p.y < -20) p.y = height + 20;
                    if (p.y > height + 20) p.y = -20;

                    let currentAlpha = p.baseAlpha * starVisibility;
                    if (p.isHero) {
                        currentAlpha = p.baseAlpha * starVisibility * (0.35 + Math.sin(time * p.twinkleSpeed + p.seed) * 0.65);
                    }

                    let coreRgb;
                    if (p.isHero) {
                        coreRgb = '255, 255, 255';
                    } else {
                        if (p.colorType > 0.65) coreRgb = '0, 191, 255';
                        else if (p.colorType > 0.35) coreRgb = '255, 20, 147';
                        else coreRgb = '255, 255, 255';
                    }

                    // motion-blur streak — length comes straight from the star's
                    // CURRENT explosion velocity this frame, not from scroll pixels.
                    // As explVx/explVy decay via friction, the line shrinks back to
                    // a dot on its own, smoothly, with zero further scroll input.
                    // Reuses explSpeed computed above — no second Math.hypot call.
                    if (p.isHero) {
                        if (explSpeed > 0.3) {
                            const tailX = p.x - p.explVx * 2;
                            const tailY = p.y - p.explVy * 2;
                            ctx.beginPath();
                            ctx.moveTo(tailX, tailY);
                            ctx.lineTo(p.x, p.y);
                            ctx.strokeStyle = `rgba(${coreRgb}, ${currentAlpha * 0.55})`;
                            ctx.lineWidth = p.size;
                            ctx.stroke();
                        }
                    }

                    // Clean flat point — no per-particle halo gradient. This
                    // matches the original locked Hero spec (flat ctx.arc()
                    // circles, twinkle via alpha only) and removes what was a
                    // real per-frame cost: up to ~420 extra gradient calls
                    // during the burst window with the halo in place.
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${coreRgb}, ${currentAlpha})`;
                    ctx.fill();
                });
            }

            // rare shooting stars — only in the pristine top-of-page moment
            if (universeAlpha > 0.5) {
                shootingCooldown--;
                if (shootingCooldown <= 0) {
                    spawnShootingStar();
                    shootingCooldown = 130 + Math.random() * 200; // ~2-5.5s at 60fps
                }
            }
            ctx.globalCompositeOperation = 'screen';
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const s = shootingStars[i];
                s.x += s.vx; s.y += s.vy; s.life -= s.decay;
                if (s.life <= 0 || s.x > width + 100 || s.y > height + 100) { shootingStars.splice(i, 1); continue; }
                const mag = Math.hypot(s.vx, s.vy);
                const tailX = s.x - (s.vx / mag) * s.len;
                const tailY = s.y - (s.vy / mag) * s.len;
                const trailGrad = ctx.createLinearGradient(s.x, s.y, tailX, tailY);
                trailGrad.addColorStop(0, `rgba(255, 255, 255, ${s.life * universeAlpha})`);
                trailGrad.addColorStop(0.4, `rgba(200, 220, 255, ${s.life * 0.4 * universeAlpha})`);
                trailGrad.addColorStop(1, `rgba(255, 255, 255, 0)`);
                ctx.strokeStyle = trailGrad;
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(s.x, s.y);
                ctx.lineTo(tailX, tailY);
                ctx.stroke();
                ctx.fillStyle = `rgba(255, 255, 255, ${s.life * universeAlpha})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, 1.8, 0, Math.PI * 2);
                ctx.fill();
            }

            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
    </script>
</body>
</html>
