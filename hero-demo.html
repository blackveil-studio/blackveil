<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackveil Studio | Creative Experience</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: #020208;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            /* overflow-x: hidden (without overflow-y set) forces the UA to compute
               overflow-y as auto per spec, turning html/body into their own scroll
               container — that silently breaks position:sticky descendants further
               down (.playground-sticky-wrapper). overflow-x: clip has no such
               side effect and was the fix for this exact regression earlier. */
            overflow-x: clip;
        }

        #space-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        .page-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
        }

        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 0 40px;
        }

        .hero-title {
            font-size: 7.5vw;
            font-weight: 800;
            line-height: 0.9;
            letter-spacing: -0.04em;
            text-align: center;
            margin: 0;
            color: #ffffff;
            max-width: 1200px;
            user-select: none;
        }

        .hero-title span {
            font-style: italic;
            background: linear-gradient(90deg, #ff007f, #8a2be2, #0047ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Задаем блоку честную высоту, чтобы карточки снизу не обрезались */
        #visual-playground {
            position: relative;
            width: 100%;
            height: 320vh;
            background: transparent;
            margin-top: 20vh;
        }

        .playground-sticky-wrapper {
            position: sticky;
            top: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .playground-center-content {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 480px;
            pointer-events: none;
            user-select: none;
        }

        .playground-eyebrow {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3em;
            color: #8e8e93;
            text-transform: uppercase;
            display: block;
            margin-bottom: 15px;
        }

        .playground-title {
            font-size: 4.5vw;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.03em;
            color: #ffffff;
            margin: 0 0 20px 0;
        }

        .playground-title span {
            font-style: italic;
            background: linear-gradient(90deg, #4e85bf, #89aacc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .playground-subtext {
            font-size: 14px;
            line-height: 1.5;
            color: #86868b;
            margin: 0;
        }

        .playground-col {
            position: absolute;
            top: 0;
            width: 24vw;
            display: flex;
            flex-direction: column;
            will-change: transform;
        }

        .col-left { left: 10vw; }
        .col-right { right: 10vw; }

        /* Элегантные горизонтальные прямоугольные карточки */
        .playground-card {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 10;
            background: #0b0b12;
            border-radius: 20px;
            margin-bottom: 140px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            display: block;
            text-decoration: none;
        }

        .playground-card img, .playground-card iframe {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: none;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card-label {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 13px;
            font-weight: 500;
            color: #fff;
            z-index: 5;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .playground-card:hover {
            transform: scale(1.03) !important;
        }

        .playground-card:hover img {
            transform: scale(1.06);
        }

        .playground-card:hover .card-label {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <canvas id="space-canvas"></canvas>

    <div class="page-wrapper">
        <!-- HERO БЛОК -->
        <section class="hero-section">
            <h1 class="hero-title" id="main-title">
                Small business.<br>Big-studio <span>sites.</span>
            </h1>
        </section>

        <!-- ПОРТФОЛИО БЛОК (Visual Playground) -->
        <section id="visual-playground">
            <div class="playground-sticky-wrapper">
                <div class="playground-center-content">
                    <span class="playground-eyebrow">EXPLORATIONS</span>
                    <h2 class="playground-title">Visual <span>playground.</span></h2>
                    <p class="playground-subtext">Коллекция реальных проектов студии — кликните на любую карточку, чтобы открыть живой сайт.</p>
                </div>

                <!-- ЛЕВАЯ КОЛОНКА -->
                <div class="playground-col col-left" id="col-left">
                    <a class="playground-card" style="transform: rotate(-3deg);" href="https://alena-makej.netlify.app/" target="_blank" rel="noopener">
                        <img src="https://api.microlink.io/?url=https%3A%2F%2Falena-makej.netlify.app%2F&screenshot=true&meta=false&embed=screenshot.url&viewport.width=1600&viewport.height=900" alt="Aksana Makej">
                        <div class="card-label">Aksana Makej Studio &middot; <span>01</span></div>
                    </a>
                    <!-- Живой рабочий iframe для Женского клуба, запущен сразу -->
                    <a class="playground-card" style="transform: rotate(2deg) translateY(30px);" href="https://blackveil-studio.github.io/lavie-club/" target="_blank" rel="noopener">
                        <iframe src="https://blackveil-studio.github.io/lavie-club/" loading="lazy"></iframe>
                        <div class="card-label">La Vie Club &middot; <span>02</span></div>
                    </a>
                    <a class="playground-card" style="transform: rotate(-2deg) translateY(60px);" href="https://blackveil-studio.github.io/top-dessert-bialystok/" target="_blank" rel="noopener">
                        <img src="https://api.microlink.io/?url=https%3A%2F%2Fblackveil-studio.github.io%2Ftop-dessert-bialystok%2F&screenshot=true&meta=false&embed=screenshot.url&viewport.width=1600&viewport.height=900" alt="TOP dessert">
                        <div class="card-label">TOP dessert &middot; <span>03</span></div>
                    </a>
                    <a class="playground-card" style="transform: rotate(1deg) translateY(90px);" href="https://blackveil-studio.github.io/Innovative-Ink/" target="_blank" rel="noopener">
                        <img src="https://api.microlink.io/?url=https%3A%2F%2Fblackveil-studio.github.io%2FInnovative-Ink%2F&screenshot=true&meta=false&embed=screenshot.url&viewport.width=1600&viewport.height=900" alt="Innovative Ink">
                        <div class="card-label">Innovative Ink &middot; <span>04</span></div>
                    </a>
                </div>

                <!-- ПРАВАЯ КОЛОНКА -->
                <div class="playground-col col-right" id="col-right">
                    <a class="playground-card" style="transform: rotate(3deg) translateY(15px);" href="https://blackveil-studio.github.io/barbershop-rustam/" target="_blank" rel="noopener">
                        <img src="https://api.microlink.io/?url=https%3A%2F%2Fblackveil-studio.github.io%2Fbarbershop-rustam%2F&screenshot=true&meta=false&embed=screenshot.url&viewport.width=1600&viewport.height=900" alt="Rustam Barber">
                        <div class="card-label">Rustam Barbershop &middot; <span>05</span></div>
                    </a>
                    <!-- Живой рабочий iframe для Домика с джакузи, запущен сразу -->
                    <a class="playground-card" style="transform: rotate(-3deg) translateY(45px);" href="https://blackveil-studio.github.io/ustefanow/" target="_blank" rel="noopener">
                        <iframe src="https://blackveil-studio.github.io/ustefanow/" loading="lazy"></iframe>
                        <div class="card-label">U Stefan&oacute;w &middot; <span>06</span></div>
                    </a>
                    <a class="playground-card" style="transform: rotate(2deg) translateY(75px);" href="https://blackveil-studio.github.io/Elastyczna/" target="_blank" rel="noopener">
                        <img src="https://api.microlink.io/?url=https%3A%2F%2Fblackveil-studio.github.io%2FElastyczna%2F&screenshot=true&meta=false&embed=screenshot.url&viewport.width=1600&viewport.height=900" alt="Elastyczna">
                        <div class="card-label">Elastyczna &middot; <span>07</span></div>
                    </a>
                </div>

            </div>
        </section>
    </div>

    <script>
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');
        const colLeft = document.getElementById('col-left');
        const colRight = document.getElementById('col-right');
        const playgroundSection = document.getElementById('visual-playground');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const mouse = { x: -1000, y: -1000, targetX: -1000, targetY: -1000, radius: 95 };
        let scrollPercent = 0;
        let explosionEnergy = 0;
        let lastScrollY = window.scrollY;

        function lerp(start, end, amt) {
            return (1 - amt) * start + amt * end;
        }

        const particles = [];
        const nebulaClouds = [];

        // Полное восстановление сочной космической палитры
        const cloudColors = [
            { r: 138, g: 43,  b: 226 },
            { r: 255, g: 0,   b: 127 },
            { r: 0,   g: 71,  b: 255 },
            { r: 255, g: 105, b: 180 }
        ];

        // Генерируем сочные объемные туманности
        for (let i = 0; i < 22; i++) {
            const color = cloudColors[Math.floor(Math.random() * cloudColors.length)];
            nebulaClouds.push({
                x: Math.random() * width,
                y: Math.random() * height,
                baseX: Math.random() * width,
                baseY: Math.random() * height,
                radius: Math.random() * 200 + 250,
                r: color.r, g: color.g, b: color.b,
                baseAlpha: Math.random() * 0.12 + 0.06,
                angle: Math.random() * Math.PI * 2,
                speed: Math.random() * 0.001 + 0.0005
            });
        }

        // Возвращаем изначальную густоту звезд вселенной (3200 частиц)
        for (let i = 0; i < 3200; i++) {
            const isHeroStar = Math.random() > 0.86;
            const angle = Math.random() * Math.PI * 2;
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                baseX: Math.random() * width,
                baseY: Math.random() * height,
                vx: (Math.random() - 0.5) * 0.2,
                vy: (Math.random() - 0.5) * 0.2,
                explVx: 0, explVy: 0,
                angleFromCenter: angle,
                size: isHeroStar ? Math.random() * 1.5 + 1 : Math.random() * 0.5 + 0.2,
                baseAlpha: isHeroStar ? Math.random() * 0.6 + 0.4 : Math.random() * 0.4 + 0.1,
                isHero: isHeroStar,
                twinkleSpeed: Math.random() * 0.02 + 0.005,
                seed: Math.random() * 100
            });
        }

        window.addEventListener('mousemove', (e) => {
            mouse.targetX = e.clientX;
            mouse.targetY = e.clientY;
        });

        window.addEventListener('mouseleave', () => {
            mouse.targetX = -1000; mouse.targetY = -1000;
        });

        // Плавный запуск инерции взрыва от скорости прокрутки
        window.addEventListener('scroll', () => {
            let currentScroll = window.scrollY;
            let delta = currentScroll - lastScrollY;
            lastScrollY = currentScroll;

            // Накапливаем энергию взрыва только при движении вниз в буферной зоне
            if (currentScroll > 50 && currentScroll < 800 && delta > 0) {
                explosionEnergy += delta * 0.015;
                if (explosionEnergy > 6) explosionEnergy = 6; // Идеальный лимит силы
            }
        });

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        let currentLeftY = 0; let targetLeftY = 0;
        let currentRightY = 0; let targetRightY = 0;

        function render(time) {
            mouse.x = lerp(mouse.x, mouse.targetX, 0.08);
            mouse.y = lerp(mouse.y, mouse.targetY, 0.08);

            // Порог сжатия метаморфозы
            scrollPercent = Math.min(window.scrollY / 600, 1);

            // Жесткий сброс взрыва при возврате на самый верх страницы (scrollY < 5)
            if (window.scrollY < 5) {
                explosionEnergy = 0;
                particles.forEach(p => { p.explVx = 0; p.explVy = 0; });
            }

            // Плавное затухание энергии взрыва в каждом камере rAF
            explosionEnergy *= 0.93;

            // Очищаем и заливаем глубокий космический вакуум
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#020208';
            ctx.fillRect(0, 0, width, height);

            ctx.globalCompositeOperation = 'screen';

            // Отрисовка живых космических туманностей
            nebulaClouds.forEach(cloud => {
                cloud.angle += cloud.speed;
                cloud.x = cloud.baseX + Math.cos(cloud.angle) * 20;
                cloud.y = cloud.baseY + Math.sin(cloud.angle) * 20;

                const gradient = ctx.createRadialGradient(cloud.x, cloud.y, 5, cloud.x, cloud.y, cloud.radius);
                gradient.addColorStop(0, `rgba(${cloud.r}, ${cloud.g}, ${cloud.b}, ${cloud.baseAlpha})`);
                gradient.addColorStop(0.5, `rgba(${cloud.r}, ${cloud.g}, ${cloud.b}, ${cloud.baseAlpha * 0.4})`);
                gradient.addColorStop(1, `rgba(${cloud.r}, ${cloud.g}, ${cloud.b}, 0)`);

                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, cloud.radius, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
            });

            // Отрисовка и физика звезд с оригинальным отталкиванием
            particles.forEach(p => {
                // Придаем автономный импульс взрыва по радиусу от центра экрана
                if (explosionEnergy > 0.01) {
                    p.explVx += Math.cos(p.angleFromCenter) * explosionEnergy * 0.12;
                    p.explVy += Math.sin(p.angleFromCenter) * explosionEnergy * 0.12;
                }

                // Гасим взрывные скорости
                p.explVx *= 0.93;
                p.explVy *= 0.93;

                // Считаем итоговые координаты (дрейф + взрыв)
                let curX = p.x + p.explVx;
                let curY = p.y + p.explVy;

                p.x += p.vx; p.y += p.vy;
                if (p.x < 0) p.x = width; if (p.x > width) p.x = 0;
                if (p.y < 0) p.y = height; if (p.y > height) p.y = 0;

                // Оригинальная физика плавного отталкивания от курсора (как на старом сайте)
                const dx = curX - mouse.x;
                const dy = curY - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < mouse.radius) {
                    const force = (mouse.radius - dist) / mouse.radius;
                    p.x += (dx / dist) * force * 0.45;
                    p.y += (dy / dist) * force * 0.45;
                }

                let currentAlpha = p.baseAlpha;
                if (p.isHero) {
                    currentAlpha = p.baseAlpha * (0.35 + Math.sin(time * p.twinkleSpeed + p.seed) * 0.65);
                }

                ctx.fillStyle = `rgba(255, 255, 255, ${currentAlpha})`;

                ctx.beginPath();
                // Если есть скорость взрыва — плавно растягиваем частицы в линии движения
                if (Math.abs(p.explVx) > 0.1) {
                    ctx.moveTo(curX, curY);
                    ctx.lineTo(curX - p.explVx * 1.5, curY - p.explVy * 1.5);
                    ctx.strokeStyle = `rgba(255, 255, 255, ${currentAlpha})`;
                    ctx.lineWidth = p.size;
                    ctx.stroke();
                } else {
                    ctx.arc(curX, curY, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Логика асимметричного послушного скролла боковых колонок
            if (playgroundSection && colLeft && colRight) {
                const rect = playgroundSection.getBoundingClientRect();
                const sectionTop = window.scrollY + rect.top;
                const sectionHeight = playgroundSection.offsetHeight;

                let progress = (window.scrollY - (sectionTop - 300)) / (sectionHeight - window.innerHeight);
                progress = Math.max(0, Math.min(1, progress));

                targetLeftY = -progress * 1300;
                targetRightY = -progress * 650;

                currentLeftY = lerp(currentLeftY, targetLeftY, 0.08);
                currentRightY = lerp(currentRightY, targetRightY, 0.08);

                colLeft.style.transform = `translate3d(0, ${currentLeftY}px, 0)`;
                colRight.style.transform = `translate3d(0, ${currentRightY}px, 0)`;
            }

            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
    </script>
</body>
</html>
